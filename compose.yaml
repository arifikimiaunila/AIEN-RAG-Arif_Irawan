services:
  postgres:
    image: postgres:15-alpine
    container_name: local-postgres-analytics
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: user
      POSTGRES_DB: analytics
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d analytics"]
      interval: 5s
      timeout: 5s
      retries: 5
  api:
    image: delivery-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["uvicorn", "rag.rag:app", "--host", "0.0.0.0", "--port", "8000"]
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg2://user:user@postgres:5432/analytics
      SQLITE_PATH: /app/conversations/conversations.sqlite3
    volumes:
      - conversation-data:/app/conversations
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
  ui:
    image: delivery-agent:local
    build:
      context: .
      dockerfile: Dockerfile
    command: ["streamlit", "run", "app.py", "--server.address", "0.0.0.0", "--server.port", "8501"]
    env_file:
      - .env
    environment:
      AGENT_API_URL: http://api:8000
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:8501:8501"
volumes:
  conversation-data:
  pgdata:
